version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: pmhub_postgres
    environment:
      POSTGRES_USER: pmhub_user
      POSTGRES_PASSWORD: 1111002
      POSTGRES_DB: pm_hub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: pmhub_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://pmhub_user:1111002@postgres:5432/pm_hub_db
      - APP_NAME=PM Hub
      - DEBUG=True
      - FRONTEND_URL=http://localhost:5173

    depends_on:
      - postgres

volumes:
  postgres_data:
