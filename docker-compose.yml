services:
  postgres:
    image: postgres:15
    container_name: pmhub_postgres
    environment:
      POSTGRES_USER: pmhub_user
      POSTGRES_PASSWORD: 1111002
      POSTGRES_DB: pm_hub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost -p 5432"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  backend:
    build: .
    container_name: pmhub_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # ✅ koristi mapu umesto liste za environment – čitljivije i bez grešaka
    environment:
      DATABASE_URL: "postgresql+asyncpg://pmhub_user:1111002@postgres:5432/pm_hub_db"
      APP_NAME: "PM Hub"
      DEBUG: "true"                # env vrednosti su uvek stringovi
      FRONTEND_URL: "http://localhost:5173"
      JWT_ALG: "HS256"
      JWT_EXPIRES_IN: "3600"       # npr. 1h
      JWT_SECRET_FILE: "/run/secrets/jwt_secret"
    secrets:
      - jwt_secret
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
